<script id="help-data" type="application/json">{"articles":[{"id":"proposito","group":"Introducción","title":"Bienvenido al recorrido de tu restaurante","lead":"Todo al Día reúne las herramientas que acompañan una atención: recibir un pedido, prepararlo y seguir el trabajo del salón.","blocks":[{"title":"Un trabajo conectado","text":"Una atención puede comenzar en una mesa y continuar en el módulo preparación. Los módulos reúnen las funciones que intervienen en esos distintos momentos."},{"title":"Cómo seguiremos el recorrido","text":"Después de ingresar, conoceremos los grupos del menú: Servicio, Operación diaria y Gestión. Dentro de cada grupo, presentaremos sus módulos en orden y cerraremos cada uno con una actividad de ejemplo."},{"title":"Las imágenes como referencia","text":"Las capturas muestran un negocio de ejemplo. Sus datos y cantidades pueden variar; las pantallas que aún faltan se señalan como pendientes."}],"flow":["Ingresar","Ubicarse","Conocer un módulo","Actividad"]},{"id":"sesion","group":"0 · Inicio de sesión","title":"El primer encuentro con el panel","lead":"La pantalla de ingreso permite identificarse con una cuenta existente antes de abrir el panel del negocio.","blocks":[{"title":"Correo y contraseña","text":"Los campos \u003cstrong>Correo\u003c/strong> y \u003cstrong>Contraseña\u003c/strong> reúnen los datos de acceso. La contraseña aparece oculta en la captura."},{"title":"Entrar al negocio","text":"El botón \u003cstrong>Entrar\u003c/strong> continúa el inicio de sesión. A continuación conoceremos el menú principal que recibe al usuario."}],"images":[{"asset":"login","caption":"Detalle del formulario de inicio de sesión."}],"flow":["Correo y contraseña","Entrar","Inicio"]},{"id":"inicio","group":"1 · Acceso","title":"El menú organiza el recorrido","lead":"El menú reúne 12 módulos: 10 disponibles y 2 marcados como PRONTO, distribuidos en tres grupos.","blocks":[{"title":"Disponibles","text":"Módulos pedidos, preparación, mesas, caja, tienda, ventas, productos, clientes, gastos y configuración."},{"title":"Próximamente","text":"Los módulos inbox y reportes aparecen como \u003cstrong>PRONTO\u003c/strong> en el menú."}],"images":[{"asset":"servicioActual","caption":"Servicio · 3 módulos disponibles."},{"asset":"operacionActual","caption":"Operación diaria · 2 disponibles y 1 marcado como PRONTO."},{"asset":"gestionActual","caption":"Gestión · 5 disponibles y 1 marcado como PRONTO."}],"wide":true},{"id":"modulos","group":"Los módulos del restaurante","title":"Para qué sirven los módulos","lead":"Los módulos reúnen herramientas con un propósito común. El menú los agrupa según la parte del trabajo del restaurante que acompañan.","blocks":[{"title":"Servicio · acompañar la atención","text":"Sus módulos ayudan a recibir solicitudes, coordinar la preparación y atender el salón. Este es el primer grupo que recorreremos."},{"title":"Operación diaria · sostener la jornada","text":"Sus módulos reúnen tareas del funcionamiento cotidiano del negocio, como los cobros y el cierre del turno."},{"title":"Gestión · conocer y organizar el negocio","text":"Sus módulos permiten consultar información y mantener los datos y ajustes del restaurante. Los conoceremos después de la operación diaria, cuando estén disponibles sus referencias actualizadas."}],"flow":["Servicio","Operación diaria","Gestión"],"overview":true},{"id":"grupo-servicio","group":"Grupos del restaurante","title":"Servicio","lead":"Este grupo reúne 3 módulos disponibles para acompañar la atención, desde la llegada de una solicitud hasta el trabajo del salón.","blocks":[{"title":"El recorrido de este grupo","text":"El módulo pedidos reúne las solicitudes; el módulo preparación acompaña al equipo que las prepara; el módulo mesas organiza la atención del salón."},{"title":"Cómo lo conoceremos","text":"En cada módulo veremos su propósito y sus funciones, y terminaremos con una actividad que enlaza con el siguiente."}],"divider":true,"images":[{"asset":"servicioActual","caption":"Servicio: módulos pedidos, preparación y mesas."}],"wide":true},{"id":"pedidos","group":"Servicio · Módulo Pedidos","title":"Módulo Pedidos: acompañar cada solicitud","lead":"Comenzamos por Servicio, el primer grupo del menú. Su primer módulo es el módulo pedidos: reúne las solicitudes del restaurante y ayuda a seguir su atención.","blocks":[{"title":"Recibir y organizar","text":"La franja de nuevos pedidos ofrece \u003cstrong>Aceptar\u003c/strong> y \u003cstrong>Aceptar todos\u003c/strong>. Las columnas ordenan el trabajo en En preparación, Listos y En ruta."},{"title":"Buscar y consultar","text":"El buscador ayuda a encontrar una solicitud. \u003cstrong>Tablero\u003c/strong> muestra tarjetas y \u003cstrong>Listado\u003c/strong> organiza la información por filas; al abrir un pedido se consulta su detalle."}],"images":[{"asset":"pedidos","caption":"Vista «Pedidos en vivo» del módulo Pedidos, en el grupo Servicio."}],"wide":true},{"id":"estados-pedidos","group":"Servicio · Módulo Pedidos","title":"Cada columna señala una tarea diferente","lead":"Separar los estados permite reconocer qué necesita cada pedido: terminar su preparación, continuar la entrega o confirmar que llegó a destino.","blocks":[{"title":"En preparación","text":"Reúne los pedidos que están en la etapa de preparación. Por ejemplo, una solicitud cuyos productos aún se preparan permanece aquí; \u003cstrong>Marcar listo\u003c/strong> permite señalar el siguiente paso."},{"title":"Listos","text":"Identifica pedidos que ya terminaron su preparación. La atención continúa según su modalidad: en el ejemplo de delivery aparece \u003cstrong>Despachar\u003c/strong> para seguir con el envío."},{"title":"En ruta","text":"Muestra los pedidos que van hacia su destino. En el ejemplo de delivery, \u003cstrong>Marcar entregado\u003c/strong> permite confirmar la entrega. Este estado describe el servicio, no si el pedido está pagado."}],"images":[{"asset":"pedidos","caption":"Las columnas del módulo pedidos distinguen preparación, pedidos listos y pedidos en ruta."}],"wide":true},{"id":"detalle-pedido","group":"Servicio · Módulo Pedidos","title":"Los datos que acompañan al pedido","lead":"El detalle reúne lo necesario para comprender la solicitud y reconocer su siguiente paso.","blocks":[{"title":"Qué se pidió","text":"El número identifica la solicitud. El canal, los productos, las cantidades y las notas ayudan a entender cómo llegó y qué requiere."},{"title":"Cómo se entrega y se paga","text":"Entrega indica la modalidad y el destino cuando corresponde. Pago distingue el medio, el estado y el total: \u003cstrong>Pagado\u003c/strong> o \u003cstrong>Por cobrar\u003c/strong> son datos distintos de la etapa del servicio."},{"title":"Cómo continúa","text":"Según el estado, aparecen acciones como \u003cstrong>Marcar listo\u003c/strong>, \u003cstrong>Despachar\u003c/strong> o \u003cstrong>Marcar entregado\u003c/strong>."}],"images":[{"asset":"detalle","caption":"Detalle ampliado del pedido: identificación, productos y observaciones."}]},{"id":"ejemplo-pedidos","group":"Servicio · Módulo Pedidos · Actividad de ejemplo","title":"Acompañemos un pedido recién llegado","lead":"Imaginemos que entra una solicitud mientras el restaurante atiende otros pedidos.","blocks":[{"title":"1. Reconocer la solicitud","text":"Podemos ubicarla entre los pedidos nuevos y abrir su detalle para leer los productos y las observaciones."},{"title":"2. Identificar la siguiente acción","text":"Después de \u003cstrong>Aceptar\u003c/strong>, podemos seguir la solicitud en \u003cstrong>En preparación\u003c/strong>. En un ejemplo de delivery, pasará a \u003cstrong>Listos\u003c/strong> al terminar de prepararse y a \u003cstrong>En ruta\u003c/strong> al despacharse. Cada columna orienta una tarea distinta."},{"title":"3. Seguir con el equipo","text":"Con el pedido identificado, seguiremos dentro del grupo \u003cstrong>Servicio\u003c/strong> hacia el \u003cstrong>módulo preparación\u003c/strong>, el siguiente módulo del menú."}],"flow":["Pedido nuevo","Revisar el detalle","Aceptar","Módulo Preparación"],"next":"preparacion"},{"id":"preparacion","group":"Servicio · Módulo Preparación","title":"Módulo Preparación: coordinar al equipo","lead":"Continuamos en el grupo Servicio. Después del módulo pedidos, el módulo preparación ayuda al equipo a organizar el trabajo y reconocer qué está pendiente y qué está listo.","blocks":[{"title":"Reconocer lo pendiente","text":"Las columnas \u003cstrong>Por aceptar\u003c/strong>, \u003cstrong>Preparando\u003c/strong> y \u003cstrong>Listos\u003c/strong> ordenan los pedidos del más antiguo al más nuevo."},{"title":"Acompañar el avance","text":"Cada tarjeta muestra productos, notas y tiempos. Al tocar los productos se van tachando; el contador indica cuántos están listos y \u003cstrong>Marcar listo\u003c/strong> permite continuar la etapa."}],"images":[{"asset":"preparacion","caption":"Vista general del módulo Preparación, en el grupo Servicio."}],"wide":true},{"id":"estados-preparacion","group":"Servicio · Módulo Preparación","title":"Distinguir lo pendiente de lo terminado","lead":"El módulo preparación utiliza la misma organización por estados para ayudar al equipo a reconocer qué debe aceptar, qué está preparando y qué ya está listo.","blocks":[{"title":"Por aceptar","text":"Reúne las solicitudes que esperan aceptación. Por ejemplo, un ticket recién recibido presenta \u003cstrong>Aceptar\u003c/strong> como acción para comenzar su atención."},{"title":"Preparando","text":"Reúne el trabajo en curso. Los productos y las notas orientan la preparación; al tachar productos, el contador ayuda a reconocer el avance dentro del ticket."},{"title":"Listos","text":"Separa los tickets cuya preparación ha terminado. Así el equipo distingue lo finalizado de lo que sigue en curso. El menú de estos tickets también ofrece \u003cstrong>Volver una etapa\u003c/strong>."}],"images":[{"asset":"preparacion","caption":"Por aceptar, Preparando y Listos organizan el trabajo dentro del módulo preparación."}],"wide":true},{"id":"opciones-preparacion","group":"Servicio · Módulo Preparación","title":"Las funciones que acompañan al ticket","lead":"El menú de tres puntos reúne opciones de consulta y apoyo para el trabajo de preparación.","blocks":[{"title":"Consultar y avisar","text":"Permite \u003cstrong>Ver el detalle\u003c/strong> y ofrece avisos de retraso de \u003cstrong>5 o 10 minutos\u003c/strong>, además de Marcar como no visto y Copiar los datos del pedido."},{"title":"Imprimir documentos","text":"El apartado Imprimir distingue \u003cstrong>Orden de preparación\u003c/strong> y \u003cstrong>Ticket de pedido recibido\u003c/strong>."},{"title":"Revisar una etapa anterior","text":"En el menú de un pedido Listo aparece también \u003cstrong>Volver una etapa\u003c/strong>."}],"images":[{"asset":"opciones","caption":"Menú de un pedido en la columna Preparando."}]},{"id":"ejemplo-preparacion","group":"Servicio · Módulo Preparación · Actividad de ejemplo","title":"Sigamos un pedido que viene del salón","lead":"En el módulo preparación, dentro del grupo Servicio, aparece un ticket para servir en el restaurante.","blocks":[{"title":"1. Leer antes de preparar","text":"Podemos reconocer los productos y revisar la observación del ticket, como la indicación sobre una porción."},{"title":"2. Acompañar el avance","text":"En \u003cstrong>Preparando\u003c/strong>, los productos se van tachando y el contador muestra el avance. La acción \u003cstrong>Marcar listo\u003c/strong> permite distinguir el ticket terminado de los que continúan en preparación."},{"title":"3. Conocer el origen","text":"Lo enviado desde una mesa llega a este tablero. Para conocer el origen de esa atención, continuaremos en el grupo \u003cstrong>Servicio\u003c/strong> con el \u003cstrong>módulo mesas\u003c/strong>."}],"images":[{"asset":"ticket","caption":"Detalle de un ticket: productos, observaciones y contador de avance."}],"flow":["Leer el ticket","Seguir la preparación","Módulo Mesas"],"next":"mesas"},{"id":"mesas","group":"Servicio · Módulo Mesas","title":"Módulo Mesas: acompañar el salón","lead":"El módulo mesas completa el grupo Servicio, después del módulo preparación. Su propósito es organizar la atención del salón y reconocer la situación de cada mesa.","blocks":[{"title":"Ubicar y abrir una mesa","text":"Las pestañas, como Interior y Terraza, separan las zonas. \u003cstrong>Plano\u003c/strong> muestra su distribución y \u003cstrong>Lista\u003c/strong> presenta número, capacidad y estado; desde ambas vistas se accede a una mesa."},{"title":"Reconocer su situación","text":"La leyenda distingue Libre, Tomando pedido, En cocina, Listo para servir, Servida y Pidiendo la cuenta. Así se reconoce el momento de atención de cada mesa."}],"images":[{"asset":"mesas","caption":"Módulo Mesas: plano de Interior y leyenda de estados."}],"wide":true},{"id":"editar-salon","group":"Servicio · Módulo Mesas","title":"Las funciones para organizar el salón","lead":"Editar salón permite representar las zonas, las mesas y las referencias del espacio del restaurante.","blocks":[{"title":"Organizar las zonas","text":"\u003cstrong>+ Nueva zona\u003c/strong> permite incorporar otro espacio. Cada zona dispone de nombre y descripción."},{"title":"Distribuir las mesas","text":"Las piezas se arrastran para ubicarlas. Cada toque cambia la capacidad entre \u003cstrong>2, 4 y 6 personas\u003c/strong>; \u003cstrong>+ Mesa\u003c/strong> agrega una y la × quita una pieza."},{"title":"Dar contexto y guardar","text":"Las referencias identifican lugares como la entrada, la cocina o la caja. \u003cstrong>Listo, guardar salón\u003c/strong> permite terminar la edición."}],"images":[{"asset":"editar","caption":"Modo de edición de Interior y controles del plano."}],"wide":true},{"id":"mesas-nueva-zona","group":"Servicio · Módulo Mesas","title":"Crear una zona para otro espacio","lead":"Una zona permite reunir las mesas de un mismo sector del restaurante. Puede representar, por ejemplo, un patio o un segundo salón.","blocks":[{"title":"Comenzar desde la edición","text":"Dentro de \u003cstrong>Editar salón\u003c/strong>, la opción \u003cstrong>+ Nueva zona\u003c/strong> incorpora otro espacio junto a las zonas existentes. La captura muestra la nueva pestaña con cero mesas."},{"title":"Identificar el espacio","text":"El primer campo permite darle un nombre. La descripción ayuda a reconocer su entrada, salida o forma. El plano vacío queda disponible para organizar sus mesas."}],"images":[{"asset":"nuevaZona","caption":"Una nueva zona seleccionada en el modo de edición del salón."}],"wide":true},{"id":"mesas-zona-mesas","group":"Servicio · Módulo Mesas","title":"Añadir mesas dentro de la nueva zona","lead":"Una vez identificada la zona, sus mesas y referencias permiten representar cómo se distribuye ese espacio del restaurante.","blocks":[{"title":"Añadir y ubicar","text":"\u003cstrong>+ Mesa\u003c/strong> agrega una mesa a la zona seleccionada. La ayuda del editor indica que las piezas se arrastran para ubicarlas y que cada toque cambia la capacidad entre \u003cstrong>2, 4 y 6 personas\u003c/strong>."},{"title":"Orientar y guardar","text":"Las referencias, como \u003cstrong>Entrada\u003c/strong>, \u003cstrong>Salida\u003c/strong> o \u003cstrong>Ventana\u003c/strong>, ayudan a reconocer el espacio. Al terminar, \u003cstrong>Listo, guardar salón\u003c/strong> permite finalizar la edición."},{"title":"Un ejemplo para continuar","text":"Si el restaurante habilita un patio, podemos crear esa zona, nombrarla y añadir sus mesas. Después, la atención continúa desde una mesa del salón, como veremos a continuación."}],"images":[{"asset":"zonaElementos","caption":"Controles de la zona: nombre, descripción, + Mesa y referencias. La captura todavía muestra el plano vacío."}],"wide":true},{"id":"mesas-responsable","group":"Servicio · Módulo Mesas","title":"Elegir quién atenderá la mesa","lead":"Al abrir una mesa libre, el panel permite identificar a la persona que acompañará esa atención antes de tomar el pedido.","blocks":[{"title":"Reconocer la mesa","text":"El encabezado muestra el número, la zona y el estado \u003cstrong>Libre\u003c/strong>. Debajo aparece la pregunta \u003cstrong>¿Quién atiende esta mesa?\u003c/strong> y las personas disponibles."},{"title":"Comenzar la atención","text":"Al elegir al garzón, la mesa se abre para tomar el pedido. La persona seleccionada aparece en el panel, junto al tiempo de atención."}],"images":[{"asset":"mesaResponsable","caption":"Detalle de la selección de quien atiende; se muestra parte de la lista disponible."},{"asset":"mesaAyuda","caption":"La indicación de la interfaz explica qué ocurre al elegir al garzón."}],"pair":true},{"id":"mesa-pedido","group":"Servicio · Módulo Mesas","title":"De la mesa a la preparación","lead":"Al abrir una mesa aparece el panel para tomar el pedido. Desde aquí se eligen los productos y se prepara su envío a cocina.","blocks":[{"title":"Encontrar los productos","text":"El campo \u003cstrong>Buscar en la carta…\u003c/strong> y las tarjetas permiten localizar lo solicitado. El encabezado identifica la mesa, la zona y el estado Tomando pedido."},{"title":"Revisar lo que se enviará","text":"Los productos seleccionados aparecen en \u003cstrong>Por enviar\u003c/strong>, con controles para ajustar la cantidad. \u003cstrong>Enviar a cocina\u003c/strong> conecta la atención con el módulo preparación."}],"images":[{"asset":"mesaAsignada","caption":"Panel de una mesa con un producto por enviar a cocina."}]},{"id":"mesas-seguimiento","group":"Servicio · Módulo Mesas","title":"Reconocer la atención desde la lista","lead":"La vista Lista permite distinguir las mesas libres de las que ya comenzaron su atención dentro de la zona seleccionada.","blocks":[{"title":"Las mesas disponibles","text":"Las filas con el estado \u003cstrong>Libre\u003c/strong> muestran la capacidad y la indicación \u003cstrong>Toca para abrir la mesa\u003c/strong>."},{"title":"La atención en curso","text":"En una mesa con el estado \u003cstrong>Tomando pedido\u003c/strong> aparecen la persona que atiende, el tiempo y el importe. Estos datos ayudan a reconocer quién está a cargo y en qué momento se encuentra la atención."}],"images":[{"asset":"mesaSeguimiento","caption":"Vista Lista con mesas libres y una mesa en el estado Tomando pedido."}],"wide":true},{"id":"ejemplo-mesas","group":"Servicio · Módulo Mesas · Actividad de ejemplo","title":"Acompañemos una mesa durante la atención","lead":"Una mesa libre recibe clientes y comienza una nueva atención en el restaurante.","blocks":[{"title":"1. Ubicar la mesa","text":"Podemos encontrar una mesa libre en el plano o la lista y elegir quién la atenderá. El panel pasa a \u003cstrong>Tomando pedido\u003c/strong> y muestra a la persona seleccionada."},{"title":"2. Conectar con el módulo Preparación","text":"En el panel podemos buscar un producto, revisar su cantidad en \u003cstrong>Por enviar\u003c/strong> y reconocer el botón \u003cstrong>Enviar a cocina\u003c/strong>. El pedido continúa en el módulo preparación."},{"title":"3. Mirar lo que sigue","text":"En la lista podemos reconocer el estado de la mesa y quién la atiende. Con este ejemplo terminamos el recorrido del módulo mesas y reunimos lo aprendido antes de pasar a la operación diaria."}],"flow":["Mesa libre","Elegir quién atiende","Tomar pedido","Enviar a cocina"],"next":"cierre-servicio","images":[{"asset":"mesaAtendida","caption":"Mesa abierta: responsable de la atención, estado y productos disponibles."}]},{"id":"cierre-servicio","group":"Cierre del grupo Servicio","title":"Del salón al siguiente momento de la jornada","lead":"Hasta aquí conocimos cómo se conectan los módulos que acompañan la atención del restaurante.","blocks":[{"title":"Recibir y preparar","text":"El módulo pedidos permite seguir las solicitudes por estado. El módulo preparación ayuda al equipo a reconocer lo pendiente, lo que está en curso y lo que ya está listo."},{"title":"Organizar y atender el salón","text":"En el módulo mesas recorrimos las zonas, la distribución de mesas, la elección de quien atiende y la toma del pedido para enviarlo a cocina."},{"title":"Continuar con la operación diaria","text":"El siguiente grupo reúne el trabajo cotidiano de caja. Comenzaremos por el módulo caja para conocer la apertura del turno, las ventas, los movimientos de efectivo y el cierre."}],"flow":["Servicio","Atención del restaurante","Operación diaria"],"divider":true},{"id":"grupo-operacion","group":"Grupos del restaurante","title":"Operación diaria","lead":"Después de Servicio, pasamos a Operación diaria: 3 módulos en el orden del menú, 2 disponibles y 1 marcado como PRONTO.","blocks":[{"title":"Módulo Caja","text":"Acompaña los cobros y el cierre de turno. Su recorrido se desarrolla a continuación."},{"title":"Módulo Inbox · PRONTO","text":"El menú lo presenta para WhatsApp e Instagram, todavía marcado como PRONTO."},{"title":"Módulo Tienda","text":"Reúne pedidos online pagados con envío por courier, delivery local o retiro. Lo conoceremos después del módulo caja."}],"divider":true,"images":[{"asset":"operacionActual","caption":"Operación diaria: módulos caja, inbox (PRONTO) y tienda."}],"wide":true},{"id":"caja","group":"Operación diaria · Módulo Caja","title":"Módulo Caja: acompañar el turno","lead":"El módulo caja es el primer módulo de Operación diaria. Reúne las ventas y el control del efectivo durante el turno.","blocks":[{"title":"Comenzar con el fondo inicial","text":"Cuando la caja está cerrada, se indica el \u003cstrong>Efectivo inicial en el cajón\u003c/strong>. La pantalla aclara que este fondo sirve para dar vuelto y no cuenta como venta."},{"title":"Abrir el turno","text":"El botón \u003cstrong>Abrir caja y empezar a vender\u003c/strong> permite comenzar. El monto visible corresponde al negocio de ejemplo."}],"images":[{"asset":"cajaInicio","caption":"Formulario de apertura: efectivo inicial y acción para abrir la caja."}],"wide":false},{"id":"caja-turno","group":"Operación diaria · Módulo Caja","title":"Reconocer la caja abierta","lead":"Con el turno abierto, el resumen reúne la información del momento y los accesos a las tareas principales.","blocks":[{"title":"Leer el resumen","text":"Se muestran la apertura, el fondo inicial y el total del turno, separado en \u003cstrong>Efectivo\u003c/strong>, \u003cstrong>Transferencia\u003c/strong> y \u003cstrong>Tarjeta\u003c/strong>."},{"title":"Elegir la tarea","text":"Los botones \u003cstrong>Nueva venta\u003c/strong>, \u003cstrong>Cerrar turno\u003c/strong> y \u003cstrong>Movimiento de efectivo\u003c/strong> permiten continuar el trabajo. La pestaña \u003cstrong>Historial\u003c/strong> reúne los turnos registrados."}],"images":[{"asset":"cajaTurno","caption":"Resumen de la caja abierta y sus acciones principales."}],"wide":false},{"id":"caja-venta","group":"Operación diaria · Módulo Caja","title":"De la carta a la cuenta","lead":"Nueva venta presenta la carta, el contenido de la venta y los datos que se revisan antes de cobrar.","blocks":[{"title":"La carta y la cuenta","text":"El buscador y las categorías ayudan a encontrar productos. Al seleccionarlos, se incorporan al contenido de la venta."},{"title":"Antes de cobrar","text":"La columna lateral reúne la modalidad de entrega, el cliente, las notas, las salsas, la propina y el medio de pago. El total y la acción \u003cstrong>Cobrar\u003c/strong> aparecen al pie."}],"images":[{"asset":"cajaVenta","caption":"Vista de Nueva venta: carta, contenido de la venta y datos previos al cobro."}],"wide":true},{"id":"caja-movimiento","group":"Operación diaria · Módulo Caja","title":"Registrar entradas y salidas de efectivo","lead":"Movimiento de efectivo permite distinguir un retiro de un ingreso durante el turno.","blocks":[{"title":"Identificar el movimiento","text":"Se elige \u003cstrong>Retiro\u003c/strong> o \u003cstrong>Ingreso\u003c/strong> y se completan \u003cstrong>Monto\u003c/strong> y \u003cstrong>Motivo\u003c/strong>."},{"title":"Dejarlo registrado","text":"El botón \u003cstrong>Registrar\u003c/strong> permite continuar con los datos del movimiento; \u003cstrong>Cancelar\u003c/strong> ofrece salir del formulario."}],"images":[{"asset":"cajaMovimiento","caption":"Formulario de movimiento de efectivo."}],"wide":true},{"id":"caja-cierre","group":"Operación diaria · Módulo Caja","title":"Comparar el efectivo al cerrar","lead":"Cerrar turno presenta el espacio para cuadrar la caja con el efectivo que se cuenta al terminar.","blocks":[{"title":"Lo esperado y lo contado","text":"\u003cstrong>Debería haber\u003c/strong> muestra el importe esperado. En \u003cstrong>Efectivo contado\u003c/strong> se registra lo que hay en el cajón para conocer la diferencia."},{"title":"Terminar el turno","text":"La acción visible es \u003cstrong>Cerrar e imprimir\u003c/strong>. La captura muestra el formulario previo al cierre; no incluye el comprobante resultante."}],"images":[{"asset":"cajaCierre","caption":"Formulario de cierre: efectivo esperado, efectivo contado y acción final."}],"wide":true},{"id":"caja-historial","group":"Operación diaria · Módulo Caja","title":"Volver a los turnos registrados","lead":"Historial permite consultar la información de turnos anteriores y sus resultados.","blocks":[{"title":"Una mirada al período","text":"Las tarjetas muestran el total del período, el ticket promedio, el efectivo y los descuadres."},{"title":"Encontrar un turno","text":"El buscador indica fecha o cajero. La tabla reúne día, horario, cajero, total, efectivo, tarjeta y cuadre. El botón \u003cstrong>Excel\u003c/strong> exporta los datos en formato \u003cstrong>CSV\u003c/strong> para analizarlos en una hoja de cálculo."},{"title":"Imprimir el cierre de turno","text":"El \u003cstrong>ícono de impresora\u003c/strong>, al extremo derecho de cada fila del historial, permite \u003cstrong>imprimir el cierre de turno correspondiente\u003c/strong>. Así se puede obtener una copia del turno que se está consultando."}],"images":[{"asset":"cajaHistorial","caption":"Historial de turnos del negocio de ejemplo."},{"asset":"cajaImprimir","caption":"Detalle de un registro: el ícono de impresora aparece al extremo derecho de la fila."}],"wide":true},{"id":"caja-indicadores","group":"Operación diaria · Módulo Caja","title":"Leer el resumen del historial","lead":"Sobre el listado, las tarjetas reúnen indicadores del período. Ayudan a reconocer los importes y los turnos que presentan diferencias antes de revisar cada registro.","blocks":[{"title":"Total del período","text":"Presenta el importe total del período consultado. Debajo se muestra la cantidad de turnos que acompaña ese resumen."},{"title":"Ticket promedio","text":"Indica el importe promedio por venta. La cantidad de ventas aparece debajo para dar contexto al valor mostrado."},{"title":"Efectivo","text":"Muestra el importe identificado como efectivo en caja dentro del resumen del historial."},{"title":"Descuadres","text":"Indica cuántos turnos presentan una diferencia. Por ejemplo, el valor \u003cstrong>1\u003c/strong> de la captura corresponde a un turno con diferencia, no a un importe en dinero."}],"images":[{"asset":"cajaIndicadores","caption":"Indicadores del historial, buscador por fecha o cajero y botón Excel para exportar datos en CSV."}],"wide":true},{"id":"ejemplo-caja","group":"Operación diaria · Módulo Caja · Actividad de ejemplo","title":"Acompañemos una venta del turno","lead":"Con la caja abierta, una persona se acerca al mostrador para hacer un pedido.","blocks":[{"title":"1. Armar la cuenta","text":"Desde \u003cstrong>Nueva venta\u003c/strong> podemos encontrar los productos en la carta y revisar el contenido de la venta."},{"title":"2. Revisar antes de cobrar","text":"La modalidad de entrega, las observaciones, el medio de pago y el total ayudan a comprobar la atención antes de usar \u003cstrong>Cobrar\u003c/strong>."},{"title":"3. Continuar con las compras online","text":"En Operación diaria, el módulo inbox permanece marcado como \u003cstrong>PRONTO\u003c/strong>. Seguiremos con el módulo tienda para conocer cómo se consultan los pedidos online pagados."}],"flow":["La carta","La cuenta","Antes de cobrar"],"next":"tienda"},{"id":"tienda","group":"Operación diaria · Módulo Tienda","title":"Módulo Tienda: seguir los pedidos online","lead":"Continuamos en Operación diaria con el módulo tienda. Reúne los pedidos online pagados con envío por courier, delivery local o retiro.","blocks":[{"title":"De la compra al seguimiento","text":"La pantalla indica que los pedidos con envío a domicilio de la tienda pública aparecen aquí en cuanto se pagan. Este módulo permite consultar esa parte de la atención online."},{"title":"Reconocer la vista inicial","text":"Los controles \u003cstrong>Tablero\u003c/strong> y \u003cstrong>Listado\u003c/strong> permiten elegir cómo consultar los pedidos. En la captura aparece \u003cstrong>Aún no hay pedidos online\u003c/strong>, porque no hay registros para mostrar."}],"images":[{"asset":"tiendaPrincipal","caption":"Vista Tablero del módulo tienda, sin pedidos online registrados en el ejemplo."}],"wide":true},{"id":"tienda-consulta","group":"Operación diaria · Módulo Tienda","title":"Encontrar un pedido y reconocer su avance","lead":"El resumen superior y los filtros ayudan a orientar la consulta según la actividad del día y la modalidad de entrega.","blocks":[{"title":"La actividad del día","text":"\u003cstrong>Ventas online hoy\u003c/strong> muestra un importe y \u003cstrong>Pedidos pagados hoy\u003c/strong> una cantidad. Permiten distinguir cuánto se ha vendido de cuántos pedidos se han pagado."},{"title":"El avance de los envíos","text":"\u003cstrong>Por despachar\u003c/strong> cuenta pedidos pendientes de despacho; \u003cstrong>En tránsito\u003c/strong> señala los que están en camino. Estas tarjetas son indicadores del resumen."},{"title":"Buscar y filtrar","text":"El buscador permite localizar por código, cliente o producto. Los filtros visibles son \u003cstrong>Todos\u003c/strong>, \u003cstrong>Bluexpress\u003c/strong>, \u003cstrong>Starken\u003c/strong>, \u003cstrong>Chilexpress\u003c/strong>, \u003cstrong>Delivery local\u003c/strong>, \u003cstrong>Retiro\u003c/strong> y \u003cstrong>Devoluciones\u003c/strong>."},{"title":"Consultar el listado","text":"La vista \u003cstrong>Listado\u003c/strong> conserva los indicadores, el buscador y los filtros. En esta referencia está vacía; las filas y las acciones de un pedido se incorporarán cuando haya capturas con registros."}],"images":[{"asset":"tiendaListado","caption":"Detalle de la vista Listado: indicadores, buscador y filtros de consulta."}],"wide":true},{"id":"ejemplo-tienda","group":"Operación diaria · Módulo Tienda · Actividad de ejemplo","title":"Orientemos la consulta de una compra online","lead":"Imaginemos que una persona consulta por una compra pagada que recibirá mediante delivery local.","blocks":[{"title":"1. Ubicar la consulta","text":"En el módulo tienda podemos buscar por el código del pedido, el cliente o el producto. El filtro \u003cstrong>Delivery local\u003c/strong> ayuda a enfocar la consulta en esa modalidad."},{"title":"2. Leer el resumen con contexto","text":"Las tarjetas \u003cstrong>Por despachar\u003c/strong> y \u003cstrong>En tránsito\u003c/strong> permiten reconocer el avance general. Para conocer la situación de una compra concreta, hace falta consultar su registro; los totales por sí solos no la identifican."},{"title":"3. Continuar hacia la gestión","text":"Con esta consulta terminamos el recorrido de Operación diaria. El siguiente grupo es \u003cstrong>Gestión\u003c/strong>, que comienza por el módulo ventas y reúne herramientas para conocer y organizar el negocio."}],"flow":["Buscar la compra","Filtrar la entrega","Consultar el registro","Gestión"],"next":"grupo-gestion"},{"id":"grupo-gestion","group":"Grupos del restaurante","title":"Gestión","lead":"Gestión reúne 6 módulos para conocer los resultados y mantener la información del restaurante: 5 disponibles y el módulo reportes marcado como PRONTO.","blocks":[{"title":"Resultados e información comercial","text":"El módulo ventas permite consultar la actividad; el módulo productos reúne el catálogo y el stock; el módulo clientes organiza la información de quienes compran."},{"title":"Gastos, reportes y configuración","text":"El módulo gastos reúne los costos del negocio. El módulo reportes aparece como \u003cstrong>PRONTO\u003c/strong>. El módulo configuración concentra los usuarios, roles y datos del local."},{"title":"Cómo seguiremos","text":"Recorreremos los módulos ventas, productos, clientes y gastos, y los apartados Negocio, Operación y Sistema del módulo configuración. El módulo reportes continúa marcado como PRONTO."}],"divider":true,"images":[{"asset":"gestionActual","caption":"Gestión: seis módulos; el módulo reportes aparece como PRONTO."}],"wide":true},{"id":"ventas","group":"Gestión · Módulo Ventas","title":"Módulo Ventas: conocer la actividad","lead":"Comenzamos el grupo Gestión con el módulo ventas. Permite consultar los resultados del negocio y reconocer cómo se distribuyen sus ventas.","blocks":[{"title":"Elegir el período","text":"\u003cstrong>Hoy\u003c/strong>, \u003cstrong>Semana\u003c/strong>, \u003cstrong>Mes\u003c/strong> y \u003cstrong>Todo\u003c/strong> delimitan la consulta. El buscador permite localizar por pedido, cliente, canal o producto."},{"title":"Leer el tablero","text":"Las tarjetas reúnen \u003cstrong>Ventas\u003c/strong>, \u003cstrong>Pedidos\u003c/strong>, \u003cstrong>Ticket promedio\u003c/strong> y \u003cstrong>Tiempo de entrega\u003c/strong>. Los gráficos muestran los últimos siete días y los productos más vendidos."}],"images":[{"asset":"gestion14","caption":"Módulo Ventas: conocer la actividad. Referencia del negocio de ejemplo."}],"wide":true},{"id":"ventas-canales","group":"Gestión · Módulo Ventas","title":"Reconocer de dónde vienen las ventas","lead":"Ventas por canal ayuda a distinguir la participación de los distintos puntos de entrada al negocio.","blocks":[{"title":"Importes y participación","text":"Se presentan \u003cstrong>Sitio web\u003c/strong>, \u003cstrong>WhatsApp\u003c/strong>, \u003cstrong>Teléfono\u003c/strong> y \u003cstrong>En el local\u003c/strong>. Cada tarjeta muestra el importe y su porcentaje de las ventas."},{"title":"Comparar con contexto","text":"Por ejemplo, podemos observar qué parte corresponde al sitio web y cuál al local. Las cifras pertenecen al período consultado y al negocio de ejemplo."}],"images":[{"asset":"gestion12","caption":"Reconocer de dónde vienen las ventas. Referencia del negocio de ejemplo."}],"wide":true},{"id":"ventas-listado","group":"Gestión · Módulo Ventas","title":"Consultar las ventas una por una","lead":"La vista Listado permite relacionar cada pedido con su cliente, canal, atención, entrega y total.","blocks":[{"title":"Leer el registro","text":"Las columnas separan pedido, cliente, canal, quién atendió, entrega, ítems, pago, estado y total. El estado describe el avance del pedido; el medio de pago aparece por separado."},{"title":"Analizar o imprimir","text":"El botón \u003cstrong>Excel\u003c/strong> exporta datos en \u003cstrong>CSV\u003c/strong> para analizarlos. El ícono de impresora al final de la fila permite acceder a la impresión de esa venta."}],"images":[{"asset":"gestion11","caption":"Consultar las ventas una por una. Referencia del negocio de ejemplo."}],"wide":true},{"id":"ejemplo-ventas","group":"Gestión · Módulo Ventas · Actividad de ejemplo","title":"Del resultado a los productos","lead":"Imaginemos que queremos conocer qué se vendió durante el día.","blocks":[{"title":"1. Elegir la consulta","text":"Podemos seleccionar \u003cstrong>Hoy\u003c/strong> y revisar el total, los pedidos y los productos más vendidos."},{"title":"2. Relacionar la información","text":"El listado y las ventas por canal permiten situar esos resultados. Si necesitamos revisar la oferta o el precio de un producto, el siguiente paso del recorrido es el módulo productos."}],"flow":["Consultar ventas","Reconocer productos","Módulo Productos"],"next":"productos"},{"id":"productos","group":"Gestión · Módulo Productos","title":"Módulo Productos: organizar la oferta","lead":"Después del módulo ventas, el módulo productos reúne la carta, los precios, los costos y el control del inventario.","blocks":[{"title":"Tres espacios de trabajo","text":"\u003cstrong>Catálogo\u003c/strong> presenta la oferta; \u003cstrong>Stock\u003c/strong> permite consultar las existencias; \u003cstrong>Movimientos\u003c/strong> reúne las entradas, salidas y ajustes."},{"title":"Encontrar y revisar","text":"El buscador y las categorías ayudan a ubicar un producto. En la tabla aparecen vendidos, precio y costo, margen, \u003cstrong>Se vende\u003c/strong>, presencia en la web y acceso de edición."}],"images":[{"asset":"gestion31","caption":"Módulo Productos: organizar la oferta. Referencia del negocio de ejemplo."}],"wide":true},{"id":"productos-categorias","group":"Gestión · Módulo Productos","title":"Dar orden a las categorías","lead":"Las categorías permiten agrupar productos y facilitar su búsqueda en la carta.","blocks":[{"title":"Agregar una categoría","text":"Desde \u003cstrong>Categorías\u003c/strong> se escribe el nombre y se utiliza \u003cstrong>+ Agregar\u003c/strong>. Cada fila muestra la cantidad de productos y los controles de edición."},{"title":"Mantener el orden","text":"La indicación permite arrastrar para reordenar: ese orden se utiliza en los filtros y en el módulo caja. Al renombrar una categoría, sus productos se actualizan."},{"title":"Editar o quitar","text":"El lápiz permite editar y la papelera identifica la acción de eliminar. Las capturas muestran estos controles, sin un diálogo posterior de confirmación."}],"images":[{"asset":"gestion26","caption":"Dar orden a las categorías. Referencia del negocio de ejemplo."}],"wide":false},{"id":"productos-nuevo","group":"Gestión · Módulo Productos","title":"Comenzar la ficha de un producto","lead":"Nuevo producto abre una ficha organizada en secciones y una vista previa de cómo lo verá el cliente.","blocks":[{"title":"Lo básico","text":"La primera sección reúne foto, \u003cstrong>Nombre\u003c/strong>, \u003cstrong>Categoría\u003c/strong> y \u003cstrong>Descripción\u003c/strong>. La vista previa se actualiza mientras se completa la información."},{"title":"Reconocer lo pendiente","text":"El resumen \u003cstrong>Para guardar\u003c/strong> indica nombre y categoría, y precio de venta. El botón inferior orienta hacia la siguiente sección cuando falta información."}],"images":[{"asset":"gestion16","caption":"Comenzar la ficha de un producto. Referencia del negocio de ejemplo."}],"wide":false},{"id":"productos-precio","group":"Gestión · Módulo Productos","title":"Definir cómo se vende","lead":"Precio y venta distingue el tipo de producto, la forma de cobro y sus importes.","blocks":[{"title":"Tipo y modalidad","text":"\u003cstrong>Físico\u003c/strong> contempla inventario y despacho; \u003cstrong>Servicio\u003c/strong> se presenta sin stock ni envío. \u003cstrong>Por unidad\u003c/strong> cobra por pieza o combo; \u003cstrong>A granel\u003c/strong>, por peso o volumen."},{"title":"Costo y precio","text":"Los campos de costo y precio de venta permiten diferenciar lo que cuesta el producto de lo que paga el cliente. Debajo se muestra una referencia de ganancia y margen."}],"images":[{"asset":"gestion17","caption":"Detalle de Precio y venta: tipo, modalidad, costo y precio."}],"wide":false},{"id":"productos-variantes","group":"Gestión · Módulo Productos","title":"Distinguir versiones de un producto","lead":"Variantes permite representar versiones del mismo producto; no corresponde a los agregados que se suman por separado.","blocks":[{"title":"Activar versiones","text":"\u003cstrong>Este producto viene en versiones\u003c/strong> habilita la definición de atributos. La pantalla indica que cada combinación tiene su precio, costo y stock."},{"title":"Completar los atributos","text":"Se escriben valores y se usa Enter para agregarlos. \u003cstrong>Agregar segundo atributo\u003c/strong> permite ampliar la definición. La captura recuerda que se necesita al menos un valor para generar combinaciones."}],"images":[{"asset":"gestion18","caption":"Detalle de Variantes: activación de versiones y atributos."}],"wide":false},{"id":"productos-opciones","group":"Gestión · Módulo Productos","title":"Añadir opciones y controlar la presencia web","lead":"La ficha también contempla agregados y la forma en que el producto aparece en la tienda.","blocks":[{"title":"Pack y opciones","text":"Agrupa agregados sobre el producto cuyos precios se suman. Las opciones visibles permiten crear grupos; para versiones del producto se utiliza Variantes."},{"title":"Web y stock","text":"\u003cstrong>Visible en el sitio web\u003c/strong> permite que aparezca en la carta online. \u003cstrong>Controlar el stock de este producto\u003c/strong> indica que las ventas descuentan existencias y que se avisa cuando queda poco."},{"title":"Datos complementarios","text":"También aparecen peso para envío y \u003cstrong>Agregar especificación\u003c/strong>, para incorporar información técnica del producto."}],"images":[{"asset":"gestion22","caption":"Detalle de Web y stock: visibilidad, inventario y datos complementarios."}],"wide":false},{"id":"productos-guardar","group":"Gestión · Módulo Productos","title":"Guardar y mantener la ficha","lead":"Una vez completos los datos necesarios, Guardar producto permite finalizar la creación o la edición.","blocks":[{"title":"Un producto sin variantes","text":"La referencia muestra que se puede guardar directamente cuando no hay versiones y los requisitos están completos. Otra captura confirma el resultado con \u003cstrong>Producto creado\u003c/strong>."},{"title":"Volver a editar","text":"La ficha de edición conserva las secciones y permite \u003cstrong>Guardar producto\u003c/strong>. También muestra las acciones \u003cstrong>Duplicar\u003c/strong> y \u003cstrong>Eliminar\u003c/strong>."}],"images":[{"asset":"gestion27","caption":"Guardar y mantener la ficha. Referencia del negocio de ejemplo."}],"wide":false},{"id":"productos-importar","group":"Gestión · Módulo Productos","title":"Incorporar un listado de productos","lead":"Importar permite trabajar con un archivo o con filas copiadas desde una hoja de cálculo.","blocks":[{"title":"Preparar el archivo","text":"\u003cstrong>Descargar plantilla\u003c/strong> entrega una plantilla CSV. Las columnas comienzan con Nombre, Categoría y Precio; desde Costo en adelante se indican como opcionales."},{"title":"Cargar o pegar","text":"Se puede usar \u003cstrong>Subir archivo CSV\u003c/strong> o pegar las filas en el campo lateral. \u003cstrong>Importar\u003c/strong> es la acción para continuar con el listado preparado."}],"images":[{"asset":"gestion29","caption":"Incorporar un listado de productos. Referencia del negocio de ejemplo."}],"wide":false},{"id":"productos-stock","group":"Gestión · Módulo Productos","title":"Reconocer la situación del inventario","lead":"La vista Stock ayuda a conocer cuánto queda y qué productos requieren atención.","blocks":[{"title":"Los indicadores","text":"\u003cstrong>Con control de stock\u003c/strong> cuenta los productos controlados; \u003cstrong>Bajo mínimo\u003c/strong> señala existencias bajas; \u003cstrong>Agotados\u003c/strong> identifica faltantes. \u003cstrong>Valor del inventario\u003c/strong> se presenta valorizado al costo."},{"title":"Leer la tabla","text":"Las columnas muestran stock, mínimo, valor y estado. \u003cstrong>Sin control\u003c/strong> identifica productos cuyo stock no está siendo controlado; no equivale a un producto agotado."}],"images":[{"asset":"gestion34","caption":"Reconocer la situación del inventario. Referencia del negocio de ejemplo."}],"wide":true},{"id":"productos-movimiento","group":"Gestión · Módulo Productos","title":"Registrar un cambio de inventario","lead":"El botón de movimiento abre un formulario para indicar cómo cambian las existencias de un producto.","blocks":[{"title":"Tipo, cantidad y motivo","text":"El formulario ofrece \u003cstrong>Entrada\u003c/strong>, \u003cstrong>Salida\u003c/strong> y \u003cstrong>Ajuste\u003c/strong>. Se completan cantidad y motivo; la vista muestra la existencia resultante antes de \u003cstrong>Registrar\u003c/strong>."},{"title":"Consultar lo ocurrido","text":"La pestaña \u003cstrong>Movimientos\u003c/strong> reúne producto, cambio, motivo, quién y cuándo. Ayuda a revisar las cargas, mermas y ajustes registrados."}],"images":[{"asset":"gestion33","caption":"Registrar un cambio de inventario. Referencia del negocio de ejemplo."}],"wide":false},{"id":"ejemplo-productos","group":"Gestión · Módulo Productos · Actividad de ejemplo","title":"Una nueva bebida en la carta","lead":"Imaginemos que el restaurante incorporará una bebida a su oferta.","blocks":[{"title":"1. Preparar la ficha","text":"Podemos elegir una categoría, completar el nombre y la descripción y definir costo y precio de venta."},{"title":"2. Revisar antes de guardar","text":"La visibilidad web y el control de stock se ajustan según corresponda. Con los requisitos completos, \u003cstrong>Guardar producto\u003c/strong> termina la ficha."},{"title":"3. Continuar el recorrido","text":"Después de organizar lo que se ofrece, conoceremos a quienes compran mediante el módulo clientes."}],"flow":["Crear la ficha","Revisar y guardar","Módulo Clientes"],"next":"clientes"},{"id":"clientes","group":"Gestión · Módulo Clientes","title":"Módulo Clientes: conocer a quienes compran","lead":"Continuamos en Gestión con el módulo clientes. Reúne datos de contacto e información sobre la actividad de compra.","blocks":[{"title":"Una mirada al conjunto","text":"Las tarjetas muestran \u003cstrong>Clientes registrados\u003c/strong>, \u003cstrong>Frecuentes\u003c/strong>, \u003cstrong>Ticket promedio\u003c/strong> y \u003cstrong>Por recuperar\u003c/strong>. La captura describe frecuentes como ocho pedidos o más y por recuperar como más de treinta días sin pedir."},{"title":"Leer la actividad","text":"Cada fila reúne cliente, segmento, producto favorito, pedidos, gasto y última compra. Estos datos ayudan a situar la relación del cliente con el negocio."}],"images":[{"asset":"gestion42","caption":"Módulo Clientes: conocer a quienes compran. Referencia del negocio de ejemplo."}],"wide":true},{"id":"clientes-consulta","group":"Gestión · Módulo Clientes","title":"Encontrar un cliente y contactarlo","lead":"El buscador y los filtros permiten orientar la consulta según los datos o la actividad del cliente.","blocks":[{"title":"Buscar y filtrar","text":"Se puede buscar cliente, teléfono o zona. Los filtros son \u003cstrong>Todos\u003c/strong>, \u003cstrong>Frecuentes\u003c/strong>, \u003cstrong>Nuevos\u003c/strong>, \u003cstrong>Sin pedir hace rato\u003c/strong> y \u003cstrong>Con cuenta\u003c/strong>."},{"title":"Las acciones de cada fila","text":"Los íconos permiten enviar un mensaje por \u003cstrong>WhatsApp\u003c/strong>, enviar un \u003cstrong>correo\u003c/strong> o \u003cstrong>editar\u003c/strong> el registro. El botón \u003cstrong>Excel\u003c/strong> exporta datos en CSV para analizarlos."}],"images":[{"asset":"gestion39","caption":"Encontrar un cliente y contactarlo. Referencia del negocio de ejemplo."}],"wide":true},{"id":"clientes-ficha","group":"Gestión · Módulo Clientes","title":"Crear y actualizar un registro","lead":"Nuevo cliente y Editar cliente reúnen los datos que permiten identificar y contactar a la persona.","blocks":[{"title":"Datos de contacto","text":"La ficha incluye \u003cstrong>Nombre\u003c/strong>, \u003cstrong>WhatsApp\u003c/strong>, \u003cstrong>Correo\u003c/strong> y \u003cstrong>Dirección\u003c/strong>. El control \u003cstrong>Tiene cuenta en el sitio\u003c/strong> registra esa condición."},{"title":"Guardar los cambios","text":"\u003cstrong>Guardar cliente\u003c/strong> permite terminar. En edición aparece también \u003cstrong>Eliminar\u003c/strong>; la nota indica que los números de compra los calcula el sistema y no se editan."}],"images":[{"asset":"gestion40","caption":"Detalle de los datos editables del cliente y su condición de cuenta en el sitio."}],"wide":false},{"id":"ejemplo-clientes","group":"Gestión · Módulo Clientes · Actividad de ejemplo","title":"Retomar el contacto con un cliente","lead":"Imaginemos que queremos reconocer a quienes llevan tiempo sin comprar.","blocks":[{"title":"1. Orientar la búsqueda","text":"El filtro \u003cstrong>Sin pedir hace rato\u003c/strong> ayuda a encontrar esos registros. La última compra y la actividad aportan contexto."},{"title":"2. Elegir el contacto","text":"Podemos revisar los datos y reconocer las opciones de WhatsApp o correo. El mensaje se prepara según la atención que el negocio desea ofrecer."},{"title":"3. Mirar los costos","text":"El recorrido sigue con el módulo gastos, que reúne la otra parte de la gestión cotidiana: lo que cuesta operar el negocio."}],"flow":["Buscar al cliente","Revisar y contactar","Módulo Gastos"],"next":"gastos"},{"id":"gastos","group":"Gestión · Módulo Gastos","title":"Módulo Gastos: acompañar los costos","lead":"El módulo gastos reúne los costos del restaurante, sus comprobantes y lo que queda por pagar.","blocks":[{"title":"Distinguir importes","text":"\u003cstrong>Gasto del mes\u003c/strong> resume el total. \u003cstrong>Costos fijos\u003c/strong> y \u003cstrong>Costos variables\u003c/strong> distinguen los tipos; \u003cstrong>Por pagar\u003c/strong> señala lo pendiente."},{"title":"Consultar los registros","text":"El buscador admite gasto, proveedor o categoría. Los filtros incluyen Todos, Fijos, Variables, Por pagar y Sin comprobante. \u003cstrong>Excel\u003c/strong> exporta datos en CSV para su análisis."}],"images":[{"asset":"gestion7","caption":"Módulo Gastos: acompañar los costos. Referencia del negocio de ejemplo."}],"wide":true},{"id":"gastos-registro","group":"Gestión · Módulo Gastos","title":"Registrar un gasto con su contexto","lead":"Nuevo gasto permite describir el costo y reunir los datos necesarios para consultarlo después.","blocks":[{"title":"Identificar el gasto","text":"Se completa qué gasto es, su tipo \u003cstrong>Variable\u003c/strong> o \u003cstrong>Fijo\u003c/strong>, categoría, proveedor, monto y fecha. La descripción permite añadir contexto."},{"title":"Pago y respaldo","text":"\u003cstrong>Por pagar\u003c/strong> y \u003cstrong>Pagado\u003c/strong> describen el estado del pago. \u003cstrong>Subir archivo o foto\u003c/strong> permite adjuntar un comprobante en PDF o imagen; \u003cstrong>Guardar gasto\u003c/strong> termina el registro."}],"images":[{"asset":"gestion5","caption":"Registrar un gasto con su contexto. Referencia del negocio de ejemplo."}],"wide":false},{"id":"gastos-productos","group":"Gestión · Módulo Gastos","title":"Relacionar una compra con el inventario","lead":"El apartado ¿Qué compraste? permite asociar productos al gasto. La pantalla indica que entran al inventario al guardar.","blocks":[{"title":"Agregar los productos","text":"\u003cstrong>Agregar producto\u003c/strong> incorpora una fila para seleccionar el producto, indicar cantidad e importe y revisar el total."},{"title":"Relacionar los montos","text":"\u003cstrong>Usar como monto\u003c/strong> toma el total de productos como monto del gasto. El control \u003cstrong>Actualizar el costo de estos productos con lo que pagaste\u003c/strong> permite indicar si se actualiza su costo."}],"images":[{"asset":"gestion4","caption":"Relacionar una compra con el inventario. Referencia del negocio de ejemplo."}],"wide":false},{"id":"gastos-categorias","group":"Gestión · Módulo Gastos","title":"Organizar y mantener los gastos","lead":"Las categorías agrupan los costos y facilitan interpretar en qué se utiliza el dinero del negocio.","blocks":[{"title":"Mantener las categorías","text":"El panel permite agregar, reordenar, editar y eliminar categorías. La nota aclara que renombrar o eliminar no cambia los gastos ya registrados: conservan el nombre con que se guardaron."},{"title":"Revisar un registro","text":"El lápiz de una fila abre \u003cstrong>Editar gasto\u003c/strong>, donde se actualizan datos y comprobante. Aparecen \u003cstrong>Guardar gasto\u003c/strong> y \u003cstrong>Eliminar\u003c/strong>."},{"title":"Interpretar la distribución","text":"El resumen \u003cstrong>En qué se va la plata\u003c/strong> muestra importes y porcentajes por agrupación de gasto para comparar su participación."}],"images":[{"asset":"gestion3","caption":"Organizar y mantener los gastos. Referencia del negocio de ejemplo."}],"wide":false},{"id":"ejemplo-gastos","group":"Gestión · Módulo Gastos · Actividad de ejemplo","title":"Acompañar una compra de insumos","lead":"Imaginemos que llega una compra para el restaurante.","blocks":[{"title":"1. Registrar el costo","text":"Podemos identificar el gasto, proveedor, fecha, categoría y estado del pago, y adjuntar el comprobante."},{"title":"2. Relacionar la compra","text":"Cuando corresponda, los productos comprados se agregan al registro para su ingreso al inventario al guardar."},{"title":"3. Continuar con los ajustes","text":"El menú presenta el módulo reportes como PRONTO. Continuaremos con el módulo configuración para conocer los ajustes de Negocio, Operación y Sistema."}],"flow":["Registrar el gasto","Guardar el respaldo","Módulo Configuración"],"next":"configuracion"},{"id":"configuracion","group":"Gestión · Módulo Configuración · Negocio","title":"Módulo Configuración: datos del negocio","lead":"El módulo configuración reúne los ajustes del restaurante en Negocio, Operación y Sistema. Comenzamos por la identidad y el contacto, dentro de Negocio.","blocks":[{"title":"Identidad y contacto","text":"Se reúnen logo, nombre comercial, razón social, RUT, dirección, ciudad, teléfono y correo. La pantalla indica que los datos aparecen en el panel, el sitio web y el recibo impreso."},{"title":"Mensaje y guardado","text":"El \u003cstrong>Mensaje del recibo\u003c/strong> define el texto al pie de cada recibo. \u003cstrong>Guardar cambios\u003c/strong> aplica la edición. Después del horario conoceremos los banners y los demás ajustes de Negocio."}],"images":[{"asset":"gestion9","caption":"Datos del negocio: identidad, contacto y mensaje del recibo."}],"wide":true},{"id":"configuracion-horario","group":"Gestión · Módulo Configuración · Negocio","title":"Indicar cuándo atiende el negocio","lead":"Dentro de Datos del negocio también se encuentra Horario de atención, que se muestra en el sitio del cliente.","blocks":[{"title":"Días abiertos y cerrados","text":"Cada día permite indicar \u003cstrong>Abierto\u003c/strong> o \u003cstrong>Cerrado\u003c/strong>. Un día cerrado aparece con la indicación de que no se reciben pedidos."},{"title":"Horas de atención","text":"Para los días abiertos se muestran horas de inicio y término. \u003cstrong>+ Cierre al medio\u003c/strong> permite indicar una interrupción dentro de la jornada. La captura presenta los controles previos a ese ajuste."}],"images":[{"asset":"gestion8","caption":"Indicar cuándo atiende el negocio. Referencia del negocio de ejemplo."}],"wide":true},{"id":"configuracion-banners","group":"Gestión · Módulo Configuración · Negocio","title":"Presentar la tienda con banners","lead":"Después de los datos y el horario, Banners permite preparar las imágenes del encabezado de la tienda.","blocks":[{"title":"Una imagen para cada pantalla","text":"La referencia recomienda \u003cstrong>1920 × 550 px\u003c/strong> para escritorio y \u003cstrong>1080 × 500 px\u003c/strong> para móvil. La versión móvil es opcional; si falta, se utiliza un recorte de la imagen de escritorio."},{"title":"Orden y destino","text":"Podemos usar \u003cstrong>Agregar banner\u003c/strong>, cambiar imágenes y ajustar su orden. En \u003cstrong>Al hacer clic\u003c/strong> se define el destino; si la categoría ya no existe, aparece un aviso para corregir el enlace antes de \u003cstrong>Guardar cambios\u003c/strong>."}],"images":[{"asset":"config0","caption":"Presentar la tienda con banners. Detalle de la interfaz del negocio de ejemplo."}],"wide":true},{"id":"configuracion-pagos","group":"Gestión · Módulo Configuración · Negocio","title":"Elegir los medios de pago","lead":"Métodos de pago reúne las opciones que acepta el negocio al cobrar.","blocks":[{"title":"Medios disponibles","text":"Los interruptores corresponden a \u003cstrong>Efectivo\u003c/strong>, \u003cstrong>Transferencia\u003c/strong> y \u003cstrong>Tarjeta\u003c/strong>. La pantalla describe tarjeta como débito o crédito con máquina."},{"title":"Cuenta para transferencias","text":"Titular y RUT provienen de \u003cstrong>Datos del negocio\u003c/strong>. Aquí se completan banco, tipo y número de cuenta; luego se utiliza \u003cstrong>Guardar cambios\u003c/strong>."}],"images":[{"asset":"config4","caption":"Elegir los medios de pago. Detalle de la interfaz del negocio de ejemplo."}],"wide":true},{"id":"configuracion-canales","group":"Gestión · Módulo Configuración · Negocio","title":"Reconocer de dónde llegan los pedidos","lead":"Canales de venta permite mantener disponibles los puntos de entrada que utiliza el restaurante.","blocks":[{"title":"Cuatro canales","text":"Aparecen \u003cstrong>Sitio web\u003c/strong>, \u003cstrong>WhatsApp\u003c/strong>, \u003cstrong>Teléfono\u003c/strong> y \u003cstrong>En el local\u003c/strong>, cada uno con su interruptor."},{"title":"Una decisión que afecta al recorrido","text":"La interfaz advierte que apagar un canal oculta lo que depende de él y que siempre debe quedar al menos uno activo. Los datos de WhatsApp se completan en su propia sección."}],"images":[{"asset":"config1","caption":"Reconocer de dónde llegan los pedidos. Detalle de la interfaz del negocio de ejemplo."}],"wide":true},{"id":"configuracion-tienda","group":"Gestión · Módulo Configuración · Negocio","title":"Preparar las modalidades de entrega","lead":"Tienda online configura la entrega de la tienda pública; el módulo tienda permite consultar sus pedidos.","blocks":[{"title":"Retiro y reparto local","text":"\u003cstrong>Retiro en tienda\u003c/strong> permite recoger el pedido en el local. \u003cstrong>Delivery local\u003c/strong> utiliza la dirección del cliente y las zonas de reparto para cotizar el envío."},{"title":"Envíos por courier","text":"\u003cstrong>Envío por pagar\u003c/strong> indica que se pagan los productos y el costo de envío se informa por WhatsApp. También aparecen Bluexpress, Starken y Chilexpress; las tarifas visibles combinan base más costo por kilo multiplicado por el peso."}],"images":[{"asset":"config8","caption":"Preparar las modalidades de entrega. Detalle de la interfaz del negocio de ejemplo."}],"wide":true},{"id":"configuracion-tienda-costos","group":"Gestión · Módulo Configuración · Negocio","title":"Completar costos y presentación del envío","lead":"La continuación de Tienda online reúne valores de referencia y el mensaje superior de la tienda.","blocks":[{"title":"Valores de envío","text":"\u003cstrong>Costo de envío base\u003c/strong> se usa cuando no hay courier seleccionado. \u003cstrong>Envío gratis desde\u003c/strong> define el umbral; vacío o cero no ofrece envío gratis. \u003cstrong>Peso por defecto\u003c/strong> se utiliza cuando el producto no tiene peso."},{"title":"Mensaje de la tienda","text":"\u003cstrong>Franja superior de la tienda\u003c/strong> permite activar la cinta y escribir su texto. Si queda vacío, se usa el texto automático. Después de revisar la configuración se utiliza \u003cstrong>Guardar cambios\u003c/strong>."}],"images":[{"asset":"config9","caption":"Completar costos y presentación del envío. Detalle de la interfaz del negocio de ejemplo."}],"wide":true},{"id":"configuracion-promociones","group":"Gestión · Módulo Configuración · Negocio","title":"Acompañar las ventas con promociones","lead":"Las promociones activas se aplican en caja y en el sitio web según los canales elegidos.","blocks":[{"title":"Leer una promoción","text":"El registro muestra nombre, descuento, canales y estado. La referencia presenta una promoción \u003cstrong>Pausada\u003c/strong>, junto al interruptor y las acciones de editar y eliminar."},{"title":"Preparar una nueva","text":"\u003cstrong>Nueva promoción\u003c/strong> abre el formulario para definir el beneficio, su alcance y su programación. En la página siguiente conoceremos esos campos antes de practicar."}],"images":[{"asset":"config6","caption":"Acompañar las ventas con promociones. Detalle de la interfaz del negocio de ejemplo."}],"wide":true},{"id":"configuracion-promocion-crear","group":"Gestión · Módulo Configuración · Negocio","title":"Definir el alcance de una promoción","lead":"El formulario permite relacionar un beneficio con productos, canales y momentos de atención.","blocks":[{"title":"Beneficio y alcance","text":"Se indica un nombre y un tipo: \u003cstrong>% descuento\u003c/strong>, \u003cstrong>$ descuento\u003c/strong>, \u003cstrong>2×1\u003c/strong> o \u003cstrong>Envío gratis\u003c/strong>. Se elige \u003cstrong>Caja (POS)\u003c/strong> y/o \u003cstrong>Sitio web\u003c/strong>, y todo el catálogo, categorías o productos."},{"title":"Programación","text":"Días de la semana, horas y fechas son opcionales. Con los valores revisados, \u003cstrong>Guardar promoción\u003c/strong> completa el formulario; \u003cstrong>Cancelar\u003c/strong> permite salir de la edición."}],"images":[{"asset":"config5","caption":"Definir el alcance de una promoción. Detalle de la interfaz del negocio de ejemplo."}],"wide":true},{"id":"configuracion-whatsapp","group":"Gestión · Módulo Configuración · Negocio","title":"Identificar el canal de WhatsApp","lead":"WhatsApp Business reúne el número y el nombre visible del negocio.","blocks":[{"title":"Datos del contacto","text":"Los campos \u003cstrong>Número\  Módulo Configuración · Operación","title":"Ubicar el punto de partida del reparto","lead":"Zonas de reparto propone tres pasos: Ubicar local, Dibujar zonas y Revisar.","blocks":[{"title":"Encontrar el local","text":"En \u003cstrong>Dirección de tu local\u003c/strong> se escribe calle, número y comuna. \u003cstrong>Ubicar en el mapa\u003c/strong> muestra el punto y sus coordenadas."},{"title":"Ajustar la referencia","text":"El pin puede arrastrarse para precisar la ubicación. Esa posición sirve de referencia para las zonas que conoceremos a continuación."}],"images":[{"asset":"config22","caption":"Ubicar el punto de partida del reparto. Detalle de la interfaz del negocio de ejemplo."}],"wide":true},{"id":"configuracion-zonas-mapa","group":"Gestión · Módulo Configuración · Operación","title":"Comprobar la ubicación en el mapa","lead":"Antes de dibujar la cobertura, podemos reconocer el punto del local y su entorno.","blocks":[{"title":"Leer el mapa","text":"El pin identifica el local. Las áreas de colores corresponden a zonas presentes en el negocio de ejemplo, con sus nombres y tarifas."},{"title":"Continuar el recorrido","text":"Cuando la ubicación represente al negocio, \u003cstrong>Continuar\u003c/strong> lleva al siguiente paso: dibujar las zonas de atención."}],"images":[{"asset":"config23","caption":"Comprobar la ubicación en el mapa. Detalle de la interfaz del negocio de ejemplo."}],"wide":true},{"id":"configuracion-zonas-dibujar","group":"Gestión · Módulo Configuración · Operación","title":"Dibujar el área de atención","lead":"En Dibujar zonas se traza la forma del área donde el negocio realiza despachos.","blocks":[{"title":"Marcar el contorno","text":"\u003cstrong>+ Dibujar zona\u003c/strong> inicia el trazado. Los puntos sobre el mapa forman los vértices; la indicación visible señala volver al primer punto para terminar."},{"title":"Representar la cobertura","text":"La forma puede adaptarse a las calles y al área de servicio. Cada zona se distingue por un color y luego se relaciona con un nombre y un precio."}],"images":[{"asset":"config19","caption":"Dibujar el área de atención. Detalle de la interfaz del negocio de ejemplo."}],"wide":true},{"id":"configuracion-zonas-tarifas","group":"Gestión · Módulo Configuración · Operación","title":"Relacionar cada zona con su tarifa","lead":"El panel Tus zonas acompaña al mapa y permite reconocer las áreas creadas.","blocks":[{"title":"Nombre y precio","text":"Cada fila reúne color, nombre y precio de la zona. Así podemos comparar lo que se observa en el mapa con su costo de despacho."},{"title":"Mantener la lista","text":"El botón de papelera aparece junto a cada registro. Antes de pasar a \u003cstrong>Revisar\u003c/strong>, conviene comprobar que las zonas y sus importes representen la atención del negocio."}],"images":[{"asset":"config18","caption":"Relacionar cada zona con su tarifa. Detalle de la interfaz del negocio de ejemplo."}],"wide":false},{"id":"configuracion-zonas-revisar","group":"Gestión · Módulo Configuración · Operación","title":"Revisar la cobertura completa","lead":"El tercer paso reúne el mapa y la lista de precios para comprobar el conjunto.","blocks":[{"title":"Comparar áreas e importes","text":"Los colores y nombres relacionan el mapa con las filas de la lista. Esta vista ayuda a revisar las tarifas antes de guardar."},{"title":"Continuar hasta las condiciones","text":"Más abajo se define qué ocurre fuera de las zonas y si habrá un monto de compra para envío gratis. Lo veremos en la siguiente página."}],"images":[{"asset":"config20","caption":"Revisar la cobertura completa. Detalle de la interfaz del negocio de ejemplo."}],"wide":true},{"id":"configuracion-zonas-limites","group":"Gestión · Módulo Configuración · Operación","title":"Definir qué ocurre fuera de las zonas","lead":"Cubrir el resto completa las condiciones del reparto antes de guardar.","blocks":[{"title":"Fuera de la cobertura","text":"Podemos elegir \u003cstrong>Cobrar un precio único fuera de las zonas\u003c/strong> o \u003cstrong>No repartir fuera de las zonas\u003c/strong>. La captura muestra seleccionada la segunda opción."},{"title":"Envío gratuito y guardado","text":"\u003cstrong>Envío gratis desde\u003c/strong> permite fijar el monto de compra; \u003cstrong>Sin envío gratis\u003c/strong> indica que no se utiliza. \u003cstrong>Guardar cambios\u003c/strong> finaliza la revisión y \u003cstrong>Atrás\u003c/strong> permite volver."}],"images":[{"asset":"config21","caption":"Definir qué ocurre fuera de las zonas. Detalle de la interfaz del negocio de ejemplo."}],"wide":true},{"id":"configuracion-repartidores","group":"Gestión · Módulo Configuración · Operación","title":"Organizar el equipo de reparto","lead":"Repartidores reúne el modo de asignación y los datos del equipo local.","blocks":[{"title":"Modo y espera","text":"En \u003cstrong>Modo de reparto\u003c/strong> la referencia muestra \u003cstrong>Los dos\u003c/strong>, dentro del ajuste entre red y equipo. También aparece \u003cstrong>Minutos antes de avisar a la red\u003c/strong> y \u003cstrong>Guardar cambios\u003c/strong>."},{"title":"Datos del repartidor","text":"Para agregarlo se presentan nombre, WhatsApp, vehículo, patente y correo. La ficha muestra disponibilidad y cuenta; \u003cstrong>Invitar\u003c/strong> requiere un correo, según la nota del panel."}],"images":[{"asset":"config16","caption":"Organizar el equipo de reparto. Detalle de la interfaz del negocio de ejemplo."}],"wide":true},{"id":"configuracion-red","group":"Gestión · Módulo Configuración · Operación","title":"Reconocer la conexión con la red de reparto","lead":"Esta sección relaciona el negocio con la central de reparto.","blocks":[{"title":"Estado y disponibilidad","text":"\u003cstrong>Estado de la conexión\u003c/strong> muestra \u003cstrong>Conectada\u003c/strong> en la referencia. \u003cstrong>Habilitar red de reparto\u003c/strong> permite ofrecer pedidos a la central."},{"title":"Datos de conexión","text":"El panel reúne URL de la central, identificador del negocio, dirección de retiro y credenciales. La nota indica dejar los secretos vacíos para conservar los actuales. \u003cstrong>Guardar cambios\u003c/strong> aplica los ajustes."}],"images":[{"asset":"config15","caption":"Reconocer la conexión con la red de reparto. Detalle de la interfaz del negocio de ejemplo."}],"wide":true},{"id":"configuracion-impresoras","group":"Gestión · Módulo Configuración · Operación","title":"Reconocer los documentos impresos","lead":"Impresoras comienza con una vista previa de los tickets que acompañan la atención.","blocks":[{"title":"Un documento para cada momento","text":"Se presentan \u003cstrong>Recibo del cliente\u003c/strong>, \u003cstrong>Pedido recibido\u003c/strong>, \u003cstrong>Orden de preparación\u003c/strong> y \u003cstrong>Etiqueta de envío\u003c/strong>, con una opción \u003cstrong>Imprimir prueba\u003c/strong> para cada vista."},{"title":"Comprobar el resultado","text":"La vista previa ayuda a comparar el ancho, margen y tamaño de fuente del documento. A continuación veremos la conexión y el destino de cada impresión."}],"images":[{"asset":"config11","caption":"Reconocer los documentos impresos. Detalle de la interfaz del negocio de ejemplo."}],"wide":true},{"id":"configuracion-impresoras-conexion","group":"Gestión · Módulo Configuración · Operación","title":"Comprobar la conexión de impresión","lead":"El estado de QZ Tray permite reconocer si el equipo está listo para imprimir mediante esa conexión.","blocks":[{"title":"Estado y certificado","text":"La captura muestra \u003cstrong>Sin conexión\u003c/strong> y \u003cstrong>Reintentar conexión\u003c/strong>. También presenta el certificado de impresión y sus opciones de descarga e instalación."},{"title":"Impresión desde el navegador","text":"La advertencia indica que, sin QZ Tray, el recibo se abre en la ventana de impresión del navegador. En \u003cstrong>Qué imprime cada documento\u003c/strong> se eligen impresora y cantidad de copias."}],"images":[{"asset":"config12","caption":"Comprobar la conexión de impresión. Detalle de la interfaz del negocio de ejemplo."}],"wide":true},{"id":"configuracion-impresoras-documentos","group":"Gestión · Módulo Configuración · Operación","title":"Asignar impresora y copias","lead":"Cada documento tiene su propio destino de impresión.","blocks":[{"title":"Documentos del recorrido","text":"Además del recibo aparecen ticket de pedido recibido, orden de preparación, etiqueta de envío y \u003cstrong>Cierre de turno\u003c/strong>. Este último corresponde al cierre de caja."},{"title":"Modo de impresión","text":"\u003cstrong>Térmica rápida (ESC/POS)\u003c/strong> envía comandos a una impresora térmica compatible. La nota indica apagarla si el equipo no es térmico ESC/POS; la referencia distingue este modo del modo lento por imagen."}],"images":[{"asset":"config13","caption":"Asignar impresora y copias. Detalle de la interfaz del negocio de ejemplo."}],"wide":true},{"id":"configuracion-impresoras-automaticas","group":"Gestión · Módulo Configuración · Operación","title":"Elegir cuándo se imprime automáticamente","lead":"La impresión automática se organiza por eventos del pedido.","blocks":[{"title":"Momentos de impresión","text":"Los controles corresponden a ticket al recibir el pedido, orden al aceptarlo y etiqueta al asignar reparto o despachar en tienda."},{"title":"Equipos y agente local","text":"\u003cstrong>Impresoras detectadas\u003c/strong> muestra las que QZ Tray encuentra en el equipo. El apartado \u003cstrong>Agente de impresión\u003c/strong> describe impresión con el navegador cerrado y ofrece \u003cstrong>Generar token\u003c/strong>; la referencia muestra el agente sin configurar."}],"images":[{"asset":"config14","caption":"Elegir cuándo se imprime automáticamente. Detalle de la interfaz del negocio de ejemplo."}],"wide":true},{"id":"ejemplo-configuracion-operacion","group":"Gestión · Módulo Configuración · Operación · Actividad de ejemplo","title":"Ac \u003cstrong>Crear e invitar\u003c/strong> envía un correo para que la persona cree su propia contraseña y entre al panel, según la explicación del formulario."}],"images":[{"asset":"config24","caption":"Invitar a una persona al panel. Detalle de la interfaz del negocio de ejemplo."}],"wide":false},{"id":"configuracion-usuarios-invitacion","group":"Gestión · Módulo Configuración · Sistema","title":"Reconocer una invitación pendiente","lead":"El listado también permite distinguir las cuentas que aún esperan completar su invitación.","blocks":[{"title":"Estado de la invitación","text":"En las filas de referencia aparece \u003cstrong>Invitación pendiente\u003c/strong> en el lugar del último acceso, junto a la opción \u003cstrong>Reenviar\u003c/strong>."},{"title":"Separar acceso e invitación","text":"El interruptor \u003cstrong>Activo\u003c/strong> se muestra por separado. Así podemos reconocer tanto el estado de acceso de la cuenta como la invitación que todavía está pendiente."}],"images":[{"asset":"config26","caption":"Reconocer una invitación pendiente. Detalle de la interfaz del negocio de ejemplo."}],"wide":true},{"id":"ejemplo-configuracion","group":"Gestión · Módulo Configuración · Sistema · Actividad de ejemplo","title":"Preparar el acceso de una nueva persona","lead":"Para cerrar el módulo configuración, imaginemos que se incorpora alguien al equipo del restaurante.","blocks":[{"title":"1. Completar sus datos","text":"Desde \u003cstrong>Nuevo usuario\u003c/strong> podemos indicar nombre, correo y rol antes de \u003cstrong>Crear e invitar\u003c/strong>."},{"title":"2. Acompañar la invitación","text":"La persona recibe el correo para crear su contraseña. En el listado se puede reconocer una invitación pendiente y la opción de reenviarla."},{"title":"3. Volver al trabajo diario","text":"Con la cuenta preparada, el recorrido vuelve al ingreso y a los módulos del restaurante. Podemos consultar cada sección cuando llegue el momento de realizar esa tarea."}],"flow":
